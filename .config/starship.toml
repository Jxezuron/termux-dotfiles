
format = """
[┌─](bold cyan)$directory$git_branch$git_status
[└─](bold cyan)$character"""

[directory]
style = "bold blue"
truncation_length = 3
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold yellow"
format = "[$all_status$ahead_behind]($style) "

[character]
success_symbol = "[❯](bold cyan)"
error_symbol = "[❯](bold red)"
